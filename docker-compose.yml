services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    volumes:
      - strapi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: ./apps/cms
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./apps/cms/.env
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4321,https://gomsuluxury.vercel.app}
    ports:
      - "${CMS_PORT:-1337}:1337"
    volumes:
      - strapi-uploads:/opt/app/public/uploads

  # Optional local preview of Astro static build (production FE nên lên Vercel)
  web:
    profiles: ["full"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL:-http://localhost:1337}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
    depends_on:
      - cms
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  strapi-db:
  strapi-uploads:
